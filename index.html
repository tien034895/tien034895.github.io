<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Preview</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            cursor: pointer;
        }

        /* Video instantly fills the entire screen */
        video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            background-size: cover;
        }
    </style>
</head>
<body>

    <!-- Autoplay and muted allows the video to render instantly on load -->
    <video id="player" autoplay loop muted playsinline preload="auto">
        <source src="rickroll.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('player');

        function handleUnmute() {
            // Unmute the video asset
            video.muted = false;

            // Attempt to force fullscreen expansion
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                document.documentElement.webkitRequestFullscreen();
            }

            // Remove listeners once audio is successfully triggered
            window.removeEventListener('mousemove', handleUnmute);
            document.body.removeEventListener('click', handleUnmute);
        }

        // Tries to unmute on the first mouse movement
        window.addEventListener('mousemove', handleUnmute);

        // Fallback: If the browser blocks mousemove audio activation, a click instantly handles it
        document.body.addEventListener('click', handleUnmute);
    </script>
</body>
</html>
