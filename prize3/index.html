<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8fb">
  <meta name="robots" content="noindex, nofollow">
  <title>Try again</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #152039;
      background: radial-gradient(ellipse at 50% 12%, #ecf3ff, transparent 68%), #f8f8fb;
    }
    main {
      width: min(100%, 520px); padding: clamp(32px, 7vw, 58px) 28px;
      border-radius: 28px; background: #fff; text-align: center;
      border: 1px solid #e8edf5; box-shadow: 0 20px 65px rgba(30,54,91,.09);
    }
    .illustration { display: block; font-size: clamp(66px, 12vw, 92px); line-height: 1.2; margin-bottom: 20px; }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .2em; color: #64748b; }
    h1 { font-size: clamp(32px, 6.5vw, 47px); line-height: 1.12; letter-spacing: -.04em; margin: 13px 0 15px; }
    .prize { font-size: clamp(24px, 5vw, 34px); font-weight: 800; color: #215fd4; margin: 17px 0; }
    p { font-size: 16px; color: #64748b; line-height: 1.6; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main aria-labelledby="result-heading">
    <span class="illustration" aria-hidden="true">🎯</span>
    <div class="eyebrow">NO PRIZE THIS TIME</div>
    <h1 id="result-heading">Try again</h1>
    
    <p>Better luck next time!</p>
  </main>
</body>
</html>
